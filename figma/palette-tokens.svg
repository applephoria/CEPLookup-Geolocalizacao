<svg width="1040" height="560" viewBox="0 0 1040 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .num-accent { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 56px; fill: #60A5FA; letter-spacing: -2px; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 24px; fill: #F8FAFC; letter-spacing: -0.5px; }
      .header-badge { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 10px; fill: #60A5FA; letter-spacing: 1.5px; text-transform: uppercase; }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; }
      
      .token-name-dark { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #F8FAFC; }
      .token-hex-dark { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11.5px; fill: #94A3B8; }
      
      .token-name-light { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #0F172A; }
      .token-hex-light { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11.5px; fill: #475569; }
    </style>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#22C55E" flood-opacity="0.4" />
    </filter>

    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#60A5FA" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Master Canvas Ground -->
  <rect width="1040" height="560" rx="20" fill="#0D1117" stroke="#30363D" stroke-width="1.5" />

  <!-- ========================================================================= -->
  <!-- MASTER HEADER UNIFICADO & PERFEITAMENTE ALINHADO                          -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 42)">
    <!-- Número 01 de Destaque -->
    <text x="0" y="52" class="num-accent">01</text>
    
    <!-- Bloco de Títulos perfeitamente alinhado à direita do 01 -->
    <g transform="translate(85, 0)">
      <rect x="0" y="0" width="168" height="22" rx="11" fill="rgba(96, 165, 250, 0.12)" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#60A5FA" />
      <text x="24" y="15" class="header-badge">CORE DESIGN SYSTEM</text>

      <text x="0" y="44" class="header-title">Color Palette &amp; Tactical Tokens</text>
      <text x="0" y="62" fill="#8B949E" font-family="sans-serif" font-size="12">Arquitetura de cores de alta fidelidade: Cockpit Tático Dark, Superfícies Suaves Light e Visor Neon.</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. HERO SHOWCASE: OVERLAPPING BUBBLE SWATCHES (Colors.cafe Style)         -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 134)">
    <rect x="0" y="0" width="940" height="144" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1" filter="url(#card-shadow)" />

    <!-- Left Header info -->
    <g transform="translate(32, 28)">
      <text x="0" y="0" class="section-label" fill="#60A5FA">IDENTIDADE TÁTICA &amp; ACENTOS DO RADAR</text>
      <text x="0" y="24" class="token-name-dark" font-size="16">Cores de Sinal &amp; Vetores GPS</text>
      <text x="0" y="44" fill="#8B949E" font-family="sans-serif" font-size="11.5">Acentos fluorescentes projetados para contraste imediato sobre cartografia.</text>
    </g>

    <!-- Colors.cafe Overlapping Bubble Clusters -->
    <g transform="translate(500, 20)">
      <circle cx="45" cy="46" r="38" fill="#0D121B" stroke="#30363D" stroke-width="2" />
      <circle cx="110" cy="46" r="38" fill="#22C55E" filter="url(#glow-green)" />
      <circle cx="175" cy="46" r="38" fill="#60A5FA" filter="url(#glow-blue)" />
      <circle cx="240" cy="46" r="38" fill="#F8FAFC" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

      <!-- Floating Labels under bubbles -->
      <text x="45" y="104" text-anchor="middle" fill="#8E96A4" class="token-hex-dark" font-size="10.5">#0D121B</text>
      <text x="110" y="104" text-anchor="middle" fill="#22C55E" class="token-hex-dark" font-size="10.5">#22C55E</text>
      <text x="175" y="104" text-anchor="middle" fill="#60A5FA" class="token-hex-dark" font-size="10.5">#60A5FA</text>
      <text x="240" y="104" text-anchor="middle" fill="#F8FAFC" class="token-hex-dark" font-size="10.5">#F8FAFC</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. DUAL-THEME ARCHITECTURE CARDS (Dark vs Light)                          -->
  <!-- ========================================================================= -->
  
  <!-- 2.1 CARD MODO ESCURO (x=50, y=298) -->
  <g transform="translate(50, 298)">
    <rect x="0" y="0" width="455" height="230" rx="16" fill="#161B22" stroke="#30363D" stroke-width="1" filter="url(#card-shadow)" />

    <!-- Header Card -->
    <g transform="translate(24, 20)">
      <circle cx="8" cy="8" r="4" fill="#60A5FA" />
      <text x="20" y="12" class="section-label" fill="#60A5FA">MODO ESCURO • COCKPIT HUD</text>
    </g>

    <!-- Swatch Cards Row 1 -->
    <g transform="translate(24, 52)">
      <!-- Swatch: Deep Ground -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="195" height="64" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1" />
        <rect x="10" y="12" width="40" height="40" rx="8" fill="#0B0E14" stroke="#30363D" stroke-width="1" />
        <text x="60" y="28" class="token-name-dark">Deep Ground</text>
        <text x="60" y="44" class="token-hex-dark">#0B0E14</text>
      </g>

      <!-- Swatch: Card Glass -->
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="195" height="64" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1" />
        <rect x="10" y="12" width="40" height="40" rx="8" fill="#141A24" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="60" y="28" class="token-name-dark">Card Glass</text>
        <text x="60" y="44" class="token-hex-dark">#141A24</text>
      </g>
    </g>

    <!-- Swatch Cards Row 2 -->
    <g transform="translate(24, 130)">
      <!-- Swatch: Radar Green -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="195" height="64" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1" />
        <rect x="10" y="12" width="40" height="40" rx="8" fill="#22C55E" />
        <text x="60" y="28" class="token-name-dark">Radar Neon</text>
        <text x="60" y="44" fill="#22C55E" class="token-hex-dark">#22C55E</text>
      </g>

      <!-- Swatch: GPS Blue -->
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="195" height="64" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1" />
        <rect x="10" y="12" width="40" height="40" rx="8" fill="#60A5FA" />
        <text x="60" y="28" class="token-name-dark">Target Vector</text>
        <text x="60" y="44" fill="#60A5FA" class="token-hex-dark">#60A5FA</text>
      </g>
    </g>
  </g>

  <!-- 2.2 CARD MODO CLARO COM CONTRASTE NITIDO (x=535, y=298) -->
  <g transform="translate(535, 298)">
    <rect x="0" y="0" width="455" height="230" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)" />

    <!-- Header Card -->
    <g transform="translate(24, 20)">
      <circle cx="8" cy="8" r="4" fill="#059669" />
      <text x="20" y="12" class="section-label" fill="#059669">MODO CLARO • TACTICAL CONTRAST</text>
    </g>

    <!-- Swatch Cards Row 1 -->
    <g transform="translate(24, 52)">
      <!-- Swatch: Atmosphere Canvas -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="195" height="64" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <rect x="10" y="12" width="40" height="40" rx="8" fill="#EEF2F6" stroke="#CBD5E1" stroke-width="1" />
        <text x="60" y="28" class="token-name-light">Atmosphere</text>
        <text x="60" y="44" class="token-hex-light">#EEF2F6</text>
      </g>

      <!-- Swatch: Paper White -->
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="195" height="64" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <rect x="10" y="12" width="40" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
        <text x="60" y="28" class="token-name-light">Paper White</text>
        <text x="60" y="44" class="token-hex-light">#FFFFFF</text>
      </g>
    </g>

    <!-- Swatch Cards Row 2 -->
    <g transform="translate(24, 130)">
      <!-- Swatch: Tactical Visor Escuro Preservado -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="195" height="64" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <rect x="10" y="12" width="40" height="40" rx="8" fill="#0D121B" stroke="#1E293B" stroke-width="1" />
        <text x="60" y="28" class="token-name-light">Visor Tático</text>
        <text x="60" y="44" fill="#059669" class="token-hex-light" font-weight="700">#0D121B</text>
      </g>

      <!-- Swatch: Slate Ink Text -->
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="195" height="64" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <rect x="10" y="12" width="40" height="40" rx="8" fill="#0F172A" />
        <text x="60" y="28" class="token-name-light">Slate Ink</text>
        <text x="60" y="44" class="token-hex-light">#0F172A</text>
      </g>
    </g>
  </g>
</svg>